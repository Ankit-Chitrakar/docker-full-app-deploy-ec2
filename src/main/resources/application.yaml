server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db?options=-c%20timezone=Asia/Kolkata
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
      enabled: true
      locations: classpath:/db/migration
  application:
    name: auth-service
jwt:
  secret: your_jwt_secret_key
  expiration: 8400000 # in seconds
