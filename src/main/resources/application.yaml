server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?options=-c%20timezone=${DB_TIMEZONE:UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
      enabled: true
      locations: classpath:/db/migration
  application:
    name: auth-service
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000 # 1 hour in milliseconds
  refresh-token-expiration-ms: 604800000 # 7 days in milliseconds
